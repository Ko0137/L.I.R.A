name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK (Capacitor + Gradle)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ☕ Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 📦 Install Node Dependencies
        run: npm install

      - name: 🔨 Compile React/TypeScript Frontend
        run: npm run build

      - name: 📱 Configure Capacitor Android Native Project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 🛡️ Inject Android Permissions & Speech Recognition into Manifest
        run: |
          python3 -c "
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          permissions = [
              'android.permission.INTERNET',
              'android.permission.RECORD_AUDIO',
              'android.permission.MODIFY_AUDIO_SETTINGS',
              'android.permission.VIBRATE',
              'android.permission.CAMERA',
              'android.permission.FLASHLIGHT',
              'android.permission.READ_EXTERNAL_STORAGE',
              'android.permission.WRITE_EXTERNAL_STORAGE',
              'android.permission.READ_MEDIA_AUDIO',
              'android.permission.READ_MEDIA_IMAGES',
              'android.permission.POST_NOTIFICATIONS'
          ]
          with open(manifest_path, 'r', encoding='utf-8') as f:
              content = f.read()

          for p in permissions:
              tag = f'<uses-permission android:name=\"{p}\" />'
              if p not in content:
                  content = content.replace('</manifest>', f'    {tag}\n</manifest>')

          with open(manifest_path, 'w', encoding='utf-8') as f:
              f.write(content)
          print('Permissions successfully injected into AndroidManifest.xml')
          "

      - name: 🔑 Fix Gradle Permissions
        run: |
          cd android
          chmod +x ./gradlew

      - name: 🚀 Compile Android APK (Gradle)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📤 Upload Ready APK File
        uses: actions/upload-artifact@v4
        with:
          name: LIRA-Assistant-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
