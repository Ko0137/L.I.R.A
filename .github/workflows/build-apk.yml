name: Build Pure Native Android APK (Java + XML)

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🔑 Fix Gradle Executable Permissions
        run: |
          chmod +x ./android/gradlew || true

      - name: 🚀 Compile Native Android APK (Gradle)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📤 Upload Native APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LIRA-Native-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
