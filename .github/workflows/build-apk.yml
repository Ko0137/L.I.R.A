name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK (Capacitor + Gradle)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Install Node Dependencies
        run: npm install

      - name: 🔨 Compile React/TypeScript Frontend
        run: npm run build

      - name: 📱 Configure Capacitor Android Native Project
        run: |
          npx cap add android || true
          npx cap sync android

      - name: 🔑 Fix Gradle Permissions
        run: |
          cd android
          chmod +x ./gradlew

      - name: 🚀 Compile Android APK (Gradle)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: 📤 Upload Ready APK File
        uses: actions/upload-artifact@v4
        with:
          name: LIRA-Assistant-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
